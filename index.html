<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cabadra — Every extra charge, in one place</title>
    <meta name="description" content="Works with your PMS. Guests order room service, spa, laundry and experiences from their phone, and every extra charge adds up to one total at checkout." />
    <!-- Default before React mounts / GuestApp takes over the tag for its own device-theme following (src/pages/GuestApp.tsx). Matches light --color-surface in src/index.css. -->
    <meta name="theme-color" content="#9992c9" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
// Dynamically swap manifest based on route for staff vs guest PWA distinction
function updateManifest() {
  const manifestLink = document.querySelector('link[rel="manifest"]');
  if (manifestLink) {
    const path = window.location.pathname;
    if (path.includes('/reception') || path.includes('/owner') || path === '/') {
      manifestLink.href = '/manifest-staff.json';
      manifestLink.setAttribute('title', 'Staff App Manifest');
    } else if (path.includes('/guest')) {
      manifestLink.href = '/manifest.json';
      manifestLink.setAttribute('title', 'Guest App Manifest');
    }
  }
}
updateManifest();
window.addEventListener('popstate', updateManifest);
</script>
</head>
  <body class="bg-surface text-on-surface antialiased selection:bg-[#bd9b60] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
