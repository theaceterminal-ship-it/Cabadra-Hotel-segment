<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cabadra — Every extra charge, in one place</title>
    <meta name="description" content="Works with your PMS. Guests order room service, spa, laundry and experiences from their phone, and every extra charge adds up to one total at checkout." />
    <!-- Default before React mounts / GuestApp takes over the tag for its own device-theme following (src/pages/GuestApp.tsx). Matches light --color-surface in src/index.css. -->
    <meta name="theme-color" content="#eef0ec" />
    <link rel="canonical" href="https://hotel.churmuri.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cabadra" />
    <meta property="og:url" content="https://hotel.churmuri.com/" />
    <meta property="og:title" content="Cabadra — Keep your PMS. Capture every extra." />
    <meta property="og:description" content="Guests order room service, spa, laundry and experiences from their phone, and every extra charge adds up to one total at checkout." />
    <meta property="og:image" content="https://hotel.churmuri.com/landing/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/guest-192.png" />
    <meta name="apple-mobile-web-app-title" content="Cabadra" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
// One manifest per app, picked from the path before React loads, so the
// guest app, staff app, kitchen screen and owner dashboard install as
// separate apps (each manifest is scoped to its own path). Elsewhere (the
// website) there's nothing to install. src/hooks/usePwaManifest.ts keeps it
// right after in-app navigation.
(function () {
  var apps = [
    ['/guest', '/manifest.json', '/icons/guest-192.png', 'Cabadra Guest'],
    ['/reception', '/manifest-staff.json', '/icons/staff-192.png', 'Cabadra Staff'],
    ['/kitchen', '/manifest-kitchen.json', '/icons/kitchen-192.png', 'Kitchen'],
    ['/owner', '/manifest-owner.json', '/icons/owner-192.png', 'Cabadra Owner']
  ];
  var path = window.location.pathname;
  var link = document.querySelector('link[rel="manifest"]');
  for (var i = 0; i < apps.length; i++) {
    if (path === apps[i][0] || path.indexOf(apps[i][0] + '/') === 0) {
      link.href = apps[i][1];
      document.querySelector('link[rel="apple-touch-icon"]').href = apps[i][2];
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content = apps[i][3];
      return;
    }
  }
  link.parentNode.removeChild(link);
})();

// The apps use the website's palette (.theme-site), switched on here before
// React loads so the first frames, and the phone's status and navigation
// bars, are never the old lavender. The guest app follows the phone's dark
// mode; it and the staff apps show the Cabadra mark until React is up, so
// the phone's launch screen flows straight into the welcome.
(function () {
  var path = window.location.pathname;
  var isApp = /^\/(guest|reception|kitchen|owner|display|task|access|bill|partner)(\/|$)/.test(path);
  if (!isApp) return;
  var root = document.documentElement;
  root.classList.add('theme-site');
  var dark = /^\/guest(\/|$)/.test(path) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (dark) { root.classList.remove('light'); root.classList.add('dark'); }
  var bg = dark ? '#0e100e' : '#eef0ec';
  root.style.background = bg;
  document.querySelector('meta[name="theme-color"]').content = bg;
  window.__cabadraBoot = { bg: bg, ink: dark ? '#f2f3ef' : '#111111' };
})();
</script>
</head>
  <body class="bg-surface text-on-surface antialiased selection:bg-[#b5d96a] selection:text-[#111]">
    <div id="root"><script>
// The Cabadra mark while the app loads (replaced as soon as React renders).
(function () {
  var b = window.__cabadraBoot;
  if (!b || !/^\/(guest|reception|kitchen|owner)(\/|$)/.test(window.location.pathname)) return;
  document.write('<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:' + b.bg + '">'
    + '<span style="position:relative;font:300 112px/1 Geist,-apple-system,Segoe UI,Roboto,sans-serif;color:' + b.ink + ';letter-spacing:-0.04em">C'
    + '<span style="position:absolute;right:-6px;bottom:14px;width:22px;height:22px;border-radius:50%;background:#b5d96a"></span></span></div>');
})();
</script></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
